# ╔══════════════════════════════════════════════════════════════╗
# ║  TUKOPAMOJA — Docker Compose (Server Deployment)           ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Runs Next.js as a standalone Node.js server.
# Use this when the target system does NOT use static hosting.
#
# Usage:
#   export NEXT_PUBLIC_SUPABASE_URL=https://xxx.supabase.co
#   export NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJ...
#   export NEXT_PUBLIC_APP_URL=https://yourdomain.com
#
#   docker compose -f docker-compose.server.yml up -d --build

name: quizarena-server

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MOBILE_SCHEME: ${NEXT_PUBLIC_MOBILE_SCHEME:-quizarena}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
