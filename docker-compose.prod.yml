# ╔══════════════════════════════════════════════════════════════╗
# ║  TUKOPAMOJA — Docker Compose (Production)                  ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Production deployment with nginx serving the static build.
# Supabase is expected to be a managed service (supabase.co).
#
# Usage:
#   docker compose -f docker-compose.prod.yml build \
#     --build-arg NEXT_PUBLIC_SUPABASE_URL=https://xxx.supabase.co \
#     --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJ... \
#     --build-arg NEXT_PUBLIC_APP_URL=https://yourdomain.com
#
#   docker compose -f docker-compose.prod.yml up -d

name: tukopamoja-prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MOBILE_SCHEME: ${NEXT_PUBLIC_MOBILE_SCHEME:-tukopamoja}
    ports:
      - "${PORT:-3000}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
