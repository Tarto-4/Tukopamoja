name: Run DB Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate-db.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ${{ vars.WORKFLOW_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check required secrets
        id: secrets_check
        env:
          HAS_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          HAS_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "$HAS_PROJECT_ID" || -z "$HAS_ACCESS_TOKEN" ]]; then
            echo "::notice::Skipping DB migration — required Supabase secrets not configured in this repository."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets_check.outputs.configured == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets_check.outputs.configured == 'true'
        with:
          version: latest

      - name: Link Supabase project
        if: steps.secrets_check.outputs.configured == 'true'
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        if: steps.secrets_check.outputs.configured == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
