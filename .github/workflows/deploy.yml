# ╔══════════════════════════════════════════════════════════════╗
# ║  TUKOPAMOJA — CD Pipeline (Deploy)                         ║
# ╚══════════════════════════════════════════════════════════════╝
# Deploys to GitHub Pages and optionally pushes a Docker image
# when code is merged to main.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "github-pages"
        type: choice
        options:
          - github-pages
          - docker-registry
          - both

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  # ── Deploy to GitHub Pages ───────────────────────────────────
  # NOTE: Primary Pages deployment is handled by deploy-pages.yml
  # (uses actions/deploy-pages@v4). This job is only for manual
  # cross-repo deploys when PUBLIC_PAGES_REPO/PAT are configured.
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.target == 'github-pages' || github.event.inputs.target == 'both')
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_MOBILE_SCHEME: tukopamoja
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:web

      - name: Deploy to public Pages repo
        env:
          PUBLIC_PAGES_REPO: ${{ vars.PUBLIC_PAGES_REPO }}
          PUBLIC_PAGES_PAT: ${{ secrets.PUBLIC_PAGES_PAT }}
        run: bash scripts/deploy-public-pages.sh

  # ── Build & Push Docker Image ────────────────────────────────
  deploy-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.target == 'docker-registry' ||
      github.event.inputs.target == 'both'
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"
