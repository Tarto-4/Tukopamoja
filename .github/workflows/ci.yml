name: CI — Lint & Typecheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck shared
        run: npm -w packages/shared run typecheck

      - name: Validate environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_MOBILE_SCHEME: quizarena
        run: node scripts/validate-env.mjs

      - name: Build web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_MOBILE_SCHEME: quizarena
        run: npm run build:web
