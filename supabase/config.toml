project_id = "tukopamoja"

[api]
port = 54321
schemas = ["public", "graphql_public", "storage"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[auth]
site_url = "https://tarto-4.github.io/Tukopamoja"
additional_redirect_urls = [
	"https://tarto-4.github.io/Tukopamoja",
	"https://tarto-4.github.io/Tukopamoja/**",
	"http://localhost:3000",
	"http://localhost:3000/auth/callback",
	"tukopamoja://auth/callback"
]

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = false
