# ╔══════════════════════════════════════════════════════════════╗
# ║  TUKOPAMOJA — nginx configuration                          ║
# ╚══════════════════════════════════════════════════════════════╝
# Optimised for serving Next.js static exports with:
#   • Compression (gzip + brotli)
#   • Security headers
#   • SPA fallback routing
#   • Cache control for hashed assets

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ─────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Next.js hashed assets (immutable cache) ──────────
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ── Static assets ────────────────────────────────────
        location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|avif|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # ── HTML pages (no cache — always get fresh) ─────────
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ── SPA fallback: try file, then dir, then 404 page ─
        location / {
            try_files $uri $uri/ $uri/index.html /index.html;
        }

        # ── Custom error pages ───────────────────────────────
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # ── Health check endpoint ────────────────────────────
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
